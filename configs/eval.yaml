# Phase 2 & 4 evaluation config.
#
# Strategy: step-level F1 reported on the full test set (cheap — just GPU time).
# LLM-as-judge explanation scoring runs on a stratified 2k subsample so judge
# spend stays bounded. Both judges (working + final) score the same subsample
# so inter-judge agreement is well-defined.

model:
  hf_id: "deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"
  dtype: "bfloat16"        # auto-downgraded to fp16 on MPS
  quantize_4bit: true      # CUDA only; ignored on MPS/CPU
  max_new_tokens: 512
  max_input_tokens: 2048

predict:
  test_path: "data/processed/test.jsonl"
  output_path: "outputs/baseline/predictions.jsonl"
  limit: null              # null = full test set; int for shakeout subsample
  subsample_seed: 0
  batch_size: 4

score:
  predictions_path: "outputs/baseline/predictions.jsonl"
  metrics_path: "outputs/baseline/metrics.json"
  judge_subsample_size: 2000
  judge_subsample_seed: 0

judging:
  # Used during dev iteration: baseline runs, training checkpoints, quick comparisons.
  # Fast and cheap, accurate enough for relative comparisons.
  working_judge_model: "claude-sonnet-4-6"

  # Used for the FINAL numbers that go in the README — base model + each trained
  # adapter, judged once on the held-out test subsample.
  final_judge_model: "claude-opus-4-7"

  # Inter-judge agreement check: have both judges score this many examples in common
  # to validate that working_judge_model's numbers are trustworthy.
  agreement_subset_size: 100

  # Human spot-check: sample this many judge labels to review manually before
  # reporting final numbers. Catches systematic judge failures.
  human_spotcheck_size: 30

  max_concurrent: 8
  max_retries: 4
