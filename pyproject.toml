[project]
name = "lora-lens"
version = "0.1.0"
description = "Probing what a LoRA adapter learns when fine-tuned for step-level reasoning verification"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3",
    "transformers>=4.45",
    "peft>=0.13",
    "datasets>=3.0",
    "accelerate>=1.0",
    "bitsandbytes>=0.44; sys_platform == 'linux'",
    "anthropic>=0.40",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "scikit-learn>=1.5",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "ipykernel>=6.29",
    "jupyter>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lora_lens"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
